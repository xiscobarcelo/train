<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pool Checklist</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f4f6f9;
--card:rgba(255,255,255,.9);
--text:#1d1d1f;
--muted:#6e6e73;
--line:rgba(0,0,0,.08);
--accent:#0071e3;
--accent2:#42a1ff;
--danger:#ff3b30;
--success:#34c759;
--warning:#ff9f0a;
--shadow:0 10px 30px rgba(0,0,0,.08);
--radius:26px;
}

*{box-sizing:border-box;}

body{
margin:0;
background:var(--bg);
font-family:"Syne",sans-serif;
color:var(--text);
}

.app{max-width:1100px;margin:auto;padding:20px;}
.shell{
background:rgba(255,255,255,.7);
border-radius:30px;
box-shadow:var(--shadow);
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:20px;
}

@media(min-width:900px){
.grid{grid-template-columns:.8fr 1.2fr;}
}

.card{
background:var(--card);
border-radius:var(--radius);
padding:20px;
border:1px solid var(--line);
}

.card-title{font-weight:700;margin-bottom:15px;}

input,textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid var(--line);
margin-bottom:10px;
font-family:inherit;
}

button{
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

.btn-primary{background:var(--accent);color:white;}
.btn-success{background:var(--success);color:white;}
.btn-danger{background:var(--danger);color:white;}
.btn-warning{background:var(--warning);}
.btn-dark{background:#eee;}

.training-item{
padding:10px;
border:1px solid var(--line);
border-radius:12px;
cursor:pointer;
margin-bottom:8px;
}

.training-item.active{background:#e8f2ff;}

.phase-item{
padding:12px;
border:1px solid var(--line);
border-radius:12px;
margin-bottom:10px;
}

.phase-item.done{opacity:.6;text-decoration:line-through;}

.phase-actions{
margin-top:10px;
display:flex;
gap:6px;
flex-wrap:wrap;
}

.progress{
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin:10px 0;
}

.progress-bar{
height:100%;
background:var(--accent);
width:0%;
}

/* LIVE MODE */

.live-mode{
position:fixed;
inset:0;
background:white;
display:none;
z-index:999;
align-items:center;
justify-content:center;
padding:20px;
}

.live-mode.active{display:flex;}

.live-card{
max-width:700px;
text-align:center;
}

.live-card h1{
font-size:48px;
margin-bottom:10px;
}

.live-card p{
color:var(--muted);
margin-bottom:20px;
}

.live-actions{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

.live-exit{
position:fixed;
top:15px;
right:15px;
font-size:22px;
}

</style>
</head>

<body>

<div class="app">
<div class="shell">

<div class="topbar">
<h2>Checklist entrenamiento</h2>
<div>
<button onclick="loadFromServer()">Sincronizar</button>
<button onclick="saveToServer()">Guardar online</button>
</div>
</div>

<div class="grid">

<!-- IZQUIERDA -->
<aside class="card">

<h3 class="card-title">Entrenamientos</h3>
<div id="trainingList"></div>

<hr>

<h3 class="card-title">Nuevo entrenamiento</h3>

<input id="trainingTitle" placeholder="Nombre">
<textarea id="trainingDesc" placeholder="Descripción"></textarea>

<button class="btn-primary" onclick="createTraining()">Crear</button>

</aside>

<!-- DERECHA -->
<main class="card">

<h3 id="editorTitle">Selecciona entrenamiento</h3>

<div id="editor" style="display:none;">

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="progressText"></div>

<button class="btn-success" onclick="startLiveMode()">Modo en vivo</button>

<h4>Fases</h4>
<div id="phaseList"></div>

<hr>

<h4>Añadir fase</h4>

<input id="phaseTitle">
<textarea id="phaseDesc"></textarea>

<button class="btn-primary" onclick="addPhase()">Añadir fase</button>
<button class="btn-warning" onclick="resetPhases()">Reset</button>
<button class="btn-danger" onclick="deleteTraining()">Eliminar</button>

</div>

</main>

</div>
</div>
</div>

<!-- LIVE MODE -->
<div id="liveMode" class="live-mode">
<button class="live-exit" onclick="exitLiveMode()">✕</button>

<div class="live-card">
<div id="liveCounter"></div>
<h1 id="liveTitle"></h1>
<p id="liveDesc"></p>

<div class="progress">
<div class="progress-bar" id="liveProgress"></div>
</div>

<div class="live-actions">
<button onclick="prevPhase()">Anterior</button>
<button class="btn-success" onclick="completePhase()">Hecho</button>
<button onclick="nextPhase()">Siguiente</button>
</div>

</div>
</div>

<script>

let state={trainings:[],active:null};
let liveIndex=0;

function save(){localStorage.setItem("data",JSON.stringify(state))}
function load(){let d=localStorage.getItem("data");if(d)state=JSON.parse(d)}

function createTraining(){
let t={id:Date.now(),title:trainingTitle.value,desc:trainingDesc.value,phases:[]}
state.trainings.push(t);state.active=t.id;save();render();
}

function selectTraining(id){state.active=id;render()}
function getActive(){return state.trainings.find(t=>t.id==state.active)}

function addPhase(){
let t=getActive();
t.phases.push({id:Date.now(),title:phaseTitle.value,desc:phaseDesc.value,done:false});
save();render();
}

function togglePhase(id){
let t=getActive();
let p=t.phases.find(x=>x.id==id);
p.done=!p.done;
save();render();
}

function movePhase(id,d){
let t=getActive();
let i=t.phases.findIndex(p=>p.id==id);
let n=i+d;
if(n<0||n>=t.phases.length)return;
[t.phases[i],t.phases[n]]=[t.phases[n],t.phases[i]];
save();render();
}

function deletePhase(id){
let t=getActive();
t.phases=t.phases.filter(p=>p.id!=id);
save();render();
}

function resetPhases(){
let t=getActive();
t.phases.forEach(p=>p.done=false);
save();render();
}

function deleteTraining(){
state.trainings=state.trainings.filter(t=>t.id!=state.active);
state.active=null;
save();render();
}

/* LIVE MODE */

function startLiveMode(){
let t=getActive();
if(!t||!t.phases.length)return;

liveIndex=0;
document.getElementById("liveMode").classList.add("active");
renderLive();
}

function exitLiveMode(){
document.getElementById("liveMode").classList.remove("active");
}

function renderLive(){
let t=getActive();
let p=t.phases[liveIndex];

liveCounter.innerText=`${liveIndex+1}/${t.phases.length}`;
liveTitle.innerText=p.title;
liveDesc.innerText=p.desc;

let done=t.phases.filter(x=>x.done).length;
let percent=Math.round(done/t.phases.length*100)||0;
liveProgress.style.width=percent+"%";
}

function completePhase(){
let t=getActive();
t.phases[liveIndex].done=true;
save();

if(liveIndex<t.phases.length-1)liveIndex++;
renderLive();render();
}

function nextPhase(){let t=getActive();if(liveIndex<t.phases.length-1){liveIndex++;renderLive()}}
function prevPhase(){if(liveIndex>0){liveIndex--;renderLive()}}

/* RENDER */

function render(){
let list=trainingList;
list.innerHTML="";

state.trainings.forEach(t=>{
list.innerHTML+=`<div class="training-item ${t.id==state.active?'active':''}" onclick="selectTraining(${t.id})">${t.title}</div>`
});

let editor=document.getElementById("editor");
if(!state.active){editor.style.display="none";return;}
editor.style.display="block";

let t=getActive();
editorTitle.innerText=t.title;

let done=t.phases.filter(p=>p.done).length;
let total=t.phases.length;
let percent=Math.round(done/total*100)||0;

progressBar.style.width=percent+"%";
progressText.innerText=done+"/"+total;

phaseList.innerHTML="";
t.phases.forEach(p=>{
phaseList.innerHTML+=`
<div class="phase-item ${p.done?'done':''}">
<strong>${p.title}</strong><br>${p.desc}
<div class="phase-actions">
<button onclick="movePhase(${p.id},-1)">↑</button>
<button onclick="movePhase(${p.id},1)">↓</button>
<button onclick="togglePhase(${p.id})">${p.done?'↺':'✔'}</button>
<button onclick="deletePhase(${p.id})">✕</button>
</div>
</div>`;
});
}

async function loadFromServer(){alert("Conecta con API")}
async function saveToServer(){alert("Conecta con API")}

load();render();

</script>

</body>
</html>
