<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pool Checklist</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="faviapple1.jpg">
  <link rel="manifest" href="manifest1.json">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>
:root{
--bg:#f4f6f9;
--card:rgba(255,255,255,.9);
--text:#1d1d1f;
--muted:#6e6e73;
--line:rgba(0,0,0,.08);
--accent:#0071e3;
--accent2:#42a1ff;
--danger:#ff3b30;
--success:#34c759;
--warning:#ff9f0a;
--shadow:0 10px 30px rgba(0,0,0,.08);
--radius:26px;
}

*{box-sizing:border-box;}

body{
margin:0;
background:var(--bg);
font-family:"Syne",sans-serif;
color:var(--text);
}

.app{
max-width:1100px;
margin:auto;
padding:20px;
}

.shell{
background:rgba(255,255,255,.7);
border-radius:30px;
box-shadow:var(--shadow);
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:20px;
}

@media(min-width:900px){
.grid{grid-template-columns:.8fr 1.2fr;}
}

.card{
background:var(--card);
border-radius:var(--radius);
padding:20px;
border:1px solid var(--line);
}

.card-title{
font-weight:700;
margin-bottom:15px;
}

input,textarea{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid var(--line);
margin-bottom:10px;
}

button{
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

.btn-primary{background:var(--accent);color:white;}
.btn-success{background:var(--success);color:white;}
.btn-danger{background:var(--danger);color:white;}
.btn-warning{background:var(--warning);color:black;}

.training-item{
padding:10px;
border:1px solid var(--line);
border-radius:12px;
cursor:pointer;
margin-bottom:8px;
}

.training-item.active{
background:#e8f2ff;
}

.phase-item{
padding:10px;
border:1px solid var(--line);
border-radius:12px;
margin-bottom:8px;
}

.phase-item.done{
opacity:.6;
text-decoration:line-through;
}

.progress{
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin:10px 0;
}

.progress-bar{
height:100%;
background:var(--accent);
width:0%;
}

</style>
</head>

<body>

<div class="app">
<div class="shell1">

<div class="grid">

<!-- IZQUIERDA -->
<aside class="card">

<h3 class="card-title">Entrenamientos</h3>
<div id="trainingList"></div>

<hr>

<h3 class="card-title">Nuevo entrenamiento</h3>

<input id="trainingTitle" placeholder="Nombre">
<textarea id="trainingDesc" placeholder="Descripción"></textarea>

<button class="btn-primary" onclick="createTraining()">Crear</button>

</aside>

<!-- DERECHA -->
<main class="card">

<h3 id="editorTitle">Selecciona entrenamiento</h3>

<div id="editor" style="display:none;">

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="progressText"></div>

<h4>Fases</h4>
<div id="phaseList"></div>

<hr>

<h4>Añadir fase</h4>

<input id="phaseTitle" placeholder="Título fase">
<textarea id="phaseDesc" placeholder="Descripción"></textarea>

<button class="btn-primary" onclick="addPhase()">Añadir fase</button>
<button class="btn-warning" onclick="resetPhases()">Reset</button>
<button class="btn-danger" onclick="deleteTraining()">Eliminar</button>

</div>

</main>

</div>
</div>
</div>

<script>

let state={
trainings:[],
active:null
};

function save(){
localStorage.setItem("checklist",JSON.stringify(state));
}

function load(){
let data=localStorage.getItem("checklist");
if(data) state=JSON.parse(data);
}

function createTraining(){
let t={
id:Date.now(),
title:document.getElementById("trainingTitle").value,
desc:document.getElementById("trainingDesc").value,
phases:[]
};
state.trainings.push(t);
state.active=t.id;
save();
render();
}

function selectTraining(id){
state.active=id;
render();
}

function addPhase(){
let t=getActive();
t.phases.push({
id:Date.now(),
title:document.getElementById("phaseTitle").value,
desc:document.getElementById("phaseDesc").value,
done:false
});
save();
render();
}

function togglePhase(id){
let t=getActive();
let p=t.phases.find(x=>x.id==id);
p.done=!p.done;
save();
render();
}

function resetPhases(){
let t=getActive();
t.phases.forEach(p=>p.done=false);
save();
render();
}

function deleteTraining(){
state.trainings=state.trainings.filter(t=>t.id!=state.active);
state.active=null;
save();
render();
}

function getActive(){
return state.trainings.find(t=>t.id==state.active);
}

function render(){

let list=document.getElementById("trainingList");
list.innerHTML="";

state.trainings.forEach(t=>{
list.innerHTML+=`
<div class="training-item ${t.id==state.active?'active':''}" onclick="selectTraining(${t.id})">
${t.title}
</div>`;
});

let editor=document.getElementById("editor");

if(!state.active){
editor.style.display="none";
return;
}

editor.style.display="block";

let t=getActive();

document.getElementById("editorTitle").innerText=t.title;

let done=t.phases.filter(p=>p.done).length;
let total=t.phases.length;

let percent=total?Math.round(done/total*100):0;

document.getElementById("progressBar").style.width=percent+"%";
document.getElementById("progressText").innerText=done+"/"+total+" completado";

let phaseList=document.getElementById("phaseList");
phaseList.innerHTML="";

t.phases.forEach(p=>{
phaseList.innerHTML+=`
<div class="phase-item ${p.done?'done':''}">
<strong>${p.title}</strong><br>
${p.desc}<br>
<button onclick="togglePhase(${p.id})">${p.done?'Desmarcar':'Hecho'}</button>
</div>`;
});

}

load();
render();

</script>

</body>
</html>
